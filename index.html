<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NaijaConnect: trusted service providers across Nigeria</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src https://dmfwihcovowpqodksvhv.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="description" content="Find electricians, plumbers, designers, tailors and more across Nigeria and chat on WhatsApp.">
<style>
:root{--bg:#FBFAF6;--card:#fff;--ink:#14211A;--mut:#5d6b63;--line:#e6e4dc;--g:#0B6B3A;--g2:#064226;--gold:#F5B301;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231c;--ink:#eef3ef;--mut:#9fb0a6;--line:#27362d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.bar,.wrap{max-width:1100px;margin:auto;padding:0 16px}.bar{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:800;font-size:20px;color:var(--g);text-decoration:none}.logo b{color:var(--gold)}
nav a,nav button.lnk{color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;margin-left:12px;background:none;border:0;cursor:pointer;font-family:inherit}
.btn{display:inline-block;border:0;border-radius:999px;padding:11px 20px;font:700 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none;background:var(--g);color:#fff}
.gold{background:var(--gold);color:#14211A}.wa{background:#25D366;color:#fff;padding:9px 16px;font-size:14px}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:56px 16px 48px;text-align:center}
.hero h1{font-size:clamp(30px,7vw,52px);line-height:1.1;margin:0 auto;max-width:760px;animation:up .6s both}.hero h1 span{color:var(--gold)}
.hero p{opacity:.85;max-width:560px;margin:14px auto 0;animation:up .6s .1s both}
.sf{display:grid;gap:10px;max-width:760px;margin:26px auto 0;background:rgba(255,255,255,.12);padding:10px;border-radius:18px;animation:up .6s .2s both}
@media(min-width:640px){.sf{grid-template-columns:1fr 190px auto}}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
h2{font-size:24px;margin:44px 0 16px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.auto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
@media(min-width:640px){.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;font-weight:600;font-size:14px;cursor:pointer;transition:.2s}.cat:hover{transform:translateY(-3px)}.cat i{display:block;font-style:normal;font-size:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;animation:up .5s both}
.tag{font-size:12px;font-weight:700;background:rgba(11,107,58,.12);color:var(--g);border-radius:99px;padding:3px 10px}.feat{background:var(--gold);color:#14211A}
.mut{color:var(--mut);font-size:14px}.price{font-weight:800;color:var(--g)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.cta{background:#14211A;color:#fff;border-radius:24px;padding:40px 20px;text-align:center;margin:44px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:520px;margin:28px auto;display:grid;gap:12px}
.tabs{display:flex;gap:8px}.tabs button{flex:1}.note{background:rgba(245,179,1,.15);border-radius:12px;padding:12px;font-size:14px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 16px}.heart{background:none;border:0;font-size:20px;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head><body>
<header><div class="bar"><a class="logo" href="#home">Naija<b>Connect</b></a><nav id="nav"></nav></div></header>
<main id="app"></main><footer>© 2026 NaijaConnect · Made in Nigeria 🇳🇬</footer>
<script>
const SB=supabase.createClient("https://dmfwihcovowpqodksvhv.supabase.co","sb_publishable_L6O8O10X8NTJN_4vq3LEpQ_Z9u0LpJ1");
const ICONS={electricians:"⚡",plumbers:"🔧","graphic-designers":"🎨",tailors:"🧵","hair-barbers":"💈",cleaners:"✨",photographers:"📷","web-developers":"💻",mechanics:"🚗","event-planners":"🎉"};
const STATES="Abia,Adamawa,Akwa Ibom,Anambra,Bauchi,Bayelsa,Benue,Borno,Cross River,Delta,Ebonyi,Edo,Ekiti,Enugu,FCT Abuja,Gombe,Imo,Jigawa,Kaduna,Kano,Katsina,Kebbi,Kogi,Kwara,Lagos,Nasarawa,Niger,Ogun,Ondo,Osun,Oyo,Plateau,Rivers,Sokoto,Taraba,Yobe,Zamfara".split(",");
const TEST=[["Chioma A.","Lagos","Found a tailor in minutes and she replied on WhatsApp straight away."],["Tunde B.","Abuja","My wiring was fixed the same day. Very easy to use."],["Ngozi E.","Enugu","As a photographer I now get new clients every week."]];
let session=null,profile=null,services=[],cats=[],favs=[],F={q:"",cat:"",state:"",sort:"price"},role="customer";
function toast(m){const d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;left:16px;right:16px;bottom:24px;z-index:99;background:#14211A;color:#fff;border:2px solid #F5B301;padding:14px 16px;border-radius:14px;font-weight:600;text-align:center";document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const naira=n=>n?"₦"+Number(n).toLocaleString("en-NG"):"Ask for price";
const opts=(a,sel,all)=>(all?`<option value="">${all}</option>`:"")+a.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return`<option value="${esc(v)}"${String(v)===String(sel)?" selected":""}>${esc(l)}</option>`}).join("");
const catOpts=()=>cats.map(c=>[c.slug,c.name]);
function card(s){const p=s.profiles||{},c=s.categories||{};const wa=p.whatsapp?`https://wa.me/${encodeURIComponent(p.whatsapp)}?text=${encodeURIComponent("Hi, I found “"+s.title+"” on NaijaConnect.")}`:"";
return`<div class="card"><div><span class="tag">${esc(c.name||"Service")}</span> ${s.is_featured?'<span class="tag feat">Featured</span>':""}</div><h3 style="margin:6px 0 0">${esc(s.title)}</h3><div class="mut">${esc(s.description)}</div><div class="mut">📍 ${esc([s.city,s.state].filter(Boolean).join(", "))} · by ${esc(p.full_name||"Provider")}</div><div class="row"><span class="price">${s.price_from?"From "+naira(s.price_from):"Ask for price"}</span><span><button class="heart" data-fav="${esc(s.provider_id)}" aria-label="Save provider">${favs.includes(s.provider_id)?"❤️":"🤍"}</button>${wa?`<a class="btn wa" target="_blank" rel="noopener" href="${wa}">WhatsApp</a>`:""}</span></div></div>`}
function results(){const q=F.q.toLowerCase();let r=services.filter(s=>(!F.cat||s.categories?.slug===F.cat)&&(!F.state||s.state===F.state)&&(!q||(s.title+" "+(s.description||"")+" "+(s.categories?.name||"")).toLowerCase().includes(q)));
r.sort((a,b)=>F.sort==="high"?(b.price_from||0)-(a.price_from||0):(a.price_from||1e12)-(b.price_from||1e12));
const el=$("#res");if(el)el.innerHTML=`<p class="mut">${r.length} result(s)</p><div class="grid auto">${r.map(card).join("")||'<p class="mut">No matches yet. Try another search.</p>'}</div>`}
const V={
home(){const f=services.slice(0,6);return`<section class="hero"><h1>Find trusted professionals <span>anywhere in Nigeria</span></h1><p>Electricians, tailors, designers and more. Compare prices and chat on WhatsApp.</p><form class="sf" id="hs"><input name="q" placeholder="What do you need? e.g. plumber"><select name="state">${opts(STATES,"","All states")}</select><button class="btn gold">Search</button></form></section><div class="wrap"><h2>Popular categories</h2><div class="grid g2 g5">${cats.map(c=>`<div class="cat" data-cat="${esc(c.slug)}"><i>${ICONS[c.slug]||"🛠️"}</i>${esc(c.name)}</div>`).join("")}</div><h2>Featured providers</h2><div class="grid auto">${f.map(card).join("")||'<p class="mut">No listings yet. Be the first provider!</p>'}</div><h2>What customers say</h2><div class="grid g3">${TEST.map(t=>`<div class="card"><div style="color:var(--gold)">★★★★★</div>“${t[2]}”<b class="mut">${t[0]}, ${t[1]}</b></div>`).join("")}</div><div class="cta"><h2 style="margin:0">Offer a service? Get found.</h2><p style="opacity:.75">Create a free provider profile and start receiving requests.</p><a class="btn gold" href="#join">Become a provider</a></div></div>`},
search(){return`<div class="wrap"><h2 style="margin-top:28px">Find a service</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><input id="fq" placeholder="Search…" value="${esc(F.q)}"><select id="fc">${opts(catOpts(),F.cat,"All categories")}</select><select id="fs">${opts(STATES,F.state,"All states")}</select><select id="fo"><option value="price">Lowest price</option><option value="high"${F.sort==="high"?" selected":""}>Highest price</option></select></div><div id="res" style="margin-top:14px"></div></div>`},
login(){return`<form class="panel" id="lf"><h2 style="margin:0">Welcome back</h2><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Password"><button class="btn">Log in</button><p class="mut" style="margin:0;text-align:center">New here? <a href="#join">Create an account</a></p></form>`},
join(){return`<form class="panel" id="jf"><h2 style="margin:0">Create your account</h2><div class="tabs"><button type="button" class="btn ghost" data-role="customer" id="rc">I need a service</button><button type="button" class="btn ghost" data-role="provider" id="rp">I offer services</button></div><input name="name" required maxlength="100" placeholder="Full name"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required minlength="8" placeholder="Password (8+ characters)"><div class="note" id="jn"></div><button class="btn">Create account</button><p class="mut" style="margin:0;text-align:center">Have an account? <a href="#login">Log in</a></p></form>`},
me(){if(!session)return V.login();if(!profile)return`<div class="panel"><p class="mut">Loading your account…</p></div>`;
let h=`<div class="panel"><h2 style="margin:0">Hello, ${esc(profile.full_name||"there")} 👋</h2><p class="mut" style="margin:0">Signed in as a <b>${esc(profile.role)}</b>${profile.role==="provider"?" · status: <b>"+esc(profile.status)+"</b>":""}</p>${profile.role==="provider"&&profile.status!=="approved"?'<div class="note">Your account is awaiting approval. Your listings go public once approved.</div>':""}</div>`;
if(profile.role==="provider"){const mine=services.filter(s=>s.provider_id===profile.id);
h+=`<form class="panel" id="pf"><h3 style="margin:0">Your business details</h3><input name="wa" placeholder="WhatsApp number e.g. 2348012345678" value="${esc(profile.whatsapp||"")}"><select name="state">${opts(STATES,profile.state,"State")}</select><input name="city" maxlength="80" placeholder="City / area" value="${esc(profile.city||"")}"><button class="btn">Save details</button></form>
<form class="panel" id="sf2"><h3 style="margin:0">Add a service</h3><input name="title" required minlength="3" maxlength="120" placeholder="Service title"><select name="cat">${opts(catOpts(),"")}</select><input name="price" type="number" min="0" placeholder="Starting price (₦)"><select name="state">${opts(STATES,profile.state)}</select><input name="city" placeholder="City / area" value="${esc(profile.city||"")}"><textarea name="desc" rows="3" maxlength="2000" placeholder="Describe your service"></textarea><button class="btn">Publish service</button></form>
<div class="wrap"><h3>Your live services</h3><div class="grid auto">${mine.map(card).join("")||'<p class="mut">None live yet.</p>'}</div></div>`}
else{const sv=services.filter(s=>favs.includes(s.provider_id));h+=`<div class="wrap"><h3>Saved providers</h3><div class="grid auto">${sv.map(card).join("")||'<p class="mut">Tap the heart on a listing to save a provider.</p>'}</div></div>`}return h}};
function setRole(r){role=r;const a=$("#rc"),b=$("#rp");if(!a)return;a.className="btn "+(r==="customer"?"":"ghost");b.className="btn "+(r==="provider"?"":"ghost");$("#jn").textContent=r==="provider"?"Provider accounts are reviewed by our team before going live.":"Customers can search, save favourites and contact providers on WhatsApp."}
function render(keep){const v=(location.hash||"#home").slice(1);const k=V[v]?v:"home";const y=scrollY;$("#app").innerHTML=V[k]();
$("#nav").innerHTML=`<a href="#search">Find services</a>`+(session?`<a href="#me">Account</a><button class="lnk" id="out">Log out</button>`:`<a href="#login">Log in</a><a href="#join">Join</a>`);
if(k==="search")results();if(k==="join")setRole(role);keep?scrollTo(0,y):scrollTo(0,0)}
async function loadServices(){const{data}=await SB.from("services").select("id,title,description,price_from,state,city,is_featured,provider_id,categories(name,slug),profiles(full_name,whatsapp)").eq("is_active",true).order("is_featured",{ascending:false}).order("created_at",{ascending:false}).limit(200);services=data||[]}
async function loadMe(){if(!session){profile=null;favs=[];return}const u=session.user.id;const{data}=await SB.from("profiles").select("*").eq("id",u).maybeSingle();profile=data;const f=await SB.from("favourites").select("provider_id").eq("customer_id",u);favs=(f.data||[]).map(x=>x.provider_id)}
document.addEventListener("click",async e=>{if(e.target.id==="out"){await SB.auth.signOut();location.hash="home";return}
const t=e.target.closest("[data-cat],[data-role],[data-fav]");if(!t)return;
if(t.dataset.cat){F={q:"",cat:t.dataset.cat,state:"",sort:"price"};if(location.hash==="#search")render();else location.hash="search"}
if(t.dataset.role)setRole(t.dataset.role);
if(t.dataset.fav){if(!session){location.hash="login";return}if(profile?.role!=="customer"){toast("Only customer accounts can save providers.");return}
const id=t.dataset.fav,on=favs.includes(id);const r=on?await SB.from("favourites").delete().eq("customer_id",profile.id).eq("provider_id",id):await SB.from("favourites").insert({customer_id:profile.id,provider_id:id});
if(r.error){toast(r.error.message);return}favs=on?favs.filter(x=>x!==id):favs.concat(id);t.textContent=on?"🤍":"❤️"}});
document.addEventListener("input",e=>{const m={fq:"q",fc:"cat",fs:"state",fo:"sort"}[e.target.id];if(m){F[m]=e.target.value;results()}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id=e.target.id,btn=e.target.querySelector("button:last-of-type");
if(id==="hs"){F={q:f.q,cat:"",state:f.state,sort:"price"};location.hash="search";return}
if(btn)btn.disabled=true;
try{if(id==="jf"){const{data,error}=await SB.auth.signUp({email:f.email,password:f.password,options:{data:{full_name:f.name,role}}});if(error)throw error;
if(!data.session){toast("Account created. Check your email to confirm it, then log in.");location.hash="login"}else location.hash="me"}
if(id==="lf"){const{error}=await SB.auth.signInWithPassword({email:f.email,password:f.password});if(error)throw error;location.hash="me"}
if(id==="pf"){const{error}=await SB.from("profiles").update({whatsapp:f.wa.replace(/\D/g,""),state:f.state,city:f.city}).eq("id",profile.id);if(error)throw error;await loadMe();await loadServices();render(true);toast("Saved")}
if(id==="sf2"){toast("Publishing…");const c=cats.find(x=>x.slug===f.cat);if(!c)throw new Error("Categories not loaded. Refresh the page and try again.");const{error}=await SB.from("services").insert({provider_id:profile.id,category_id:c.id,title:f.title,description:f.desc,price_from:Number(f.price)||null,state:f.state,city:f.city});if(error)throw error;await loadServices();e.target.reset();render(true);toast("Service published")}}
catch(x){toast(x.message||"Something went wrong")}finally{if(btn)btn.disabled=false}});
addEventListener("hashchange",()=>render());
SB.auth.onAuthStateChange(async(_,s)=>{session=s;await loadMe();await loadServices();render(true)});
(async()=>{render();const c=await SB.from("categories").select("id,name,slug").eq("is_active",true).order("id");cats=c.data||[];await loadServices();render(true)})();
</script></body></html>
